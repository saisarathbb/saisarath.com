  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', monospace;
      font-style: italic;
      font-weight: 700;
      background: #000000;
    }

    canvas {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: 1;
      opacity: 0;
      animation: fadeInCanvas 1s ease forwards;
      animation-delay: 2s;
    }

    @keyframes fadeInCanvas {
      to {
        opacity: 1;
      }
    }

    .container {
      overflow: visible;
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .black-cover {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      z-index: 10;
      transform: translateY(0);
    }

    .glass-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(780px, 92vw);
      height: min(520px, 78vh);
      z-index: 999;
      opacity: 1;
      transition: opacity 0.6s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .glass-center svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.25));
    }

    .glass-center svg path {
      stroke: #ffffff !important;
    }

    .glass-panel {
      position: relative;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.2rem 1.5rem 1.8rem 1.5rem;
      z-index: 9999;
    }

    .glass-panel::before {
      content: "";
      position: absolute;
      top: -80px;
      bottom: -80px;
      left: -80px;
      right: -80px;
      backdrop-filter: blur(4px);
      -webkit-mask-image: 
        linear-gradient(to right, transparent, black 25%, black 75%, transparent),
        linear-gradient(to bottom, transparent, black 25%, black 75%, transparent);
      -webkit-mask-composite: source-in;
      mask-image: 
        linear-gradient(to right, transparent, black 25%, black 75%, transparent),
        linear-gradient(to bottom, transparent, black 25%, black 75%, transparent);
      mask-composite: intersect;
      z-index: -1;
    }

    .iron-body-text {
      font-size: 11.7vmin;
      color: #d7d7d7;
      margin-bottom: 1.2rem;
      opacity: 0;
      transition: opacity 1.5s ease;
      -webkit-user-select: none;
      user-select: none;
    }

    .bio-container {
      display: grid;
      grid-template-rows: auto 0fr auto;
      margin-bottom: 0;
      opacity: 0;
      transition: grid-template-rows 1.5s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 1.5s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 999;
      width: 100%;
      max-width: 600px;
    }

    .bio-container.show {
      grid-template-rows: auto 1fr auto;
      opacity: 1;
    }

    .divider {
      width: 15vmin;
      height: 2px;
      background-color: #d7d7d7;
      margin: 0 auto;
      border-radius: 1px;
      align-self: center;
      transform: translateZ(0);
    }

    .bio-inner-wrapper {
      overflow: hidden;
      min-height: 0;
    }

    .bio-text {
      font-family: 'Space Mono', monospace;
      font-style: normal;
      font-weight: 400;
      /* Reduced base scale for a more refined look */
      font-size: clamp(11px, 1.6vmin + 0.25rem, 18px);
      color: #d7d7d7;
      text-align: center;
      margin: 1.2rem 0;
      -webkit-user-select: none;
      user-select: none;
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: 0.3;
      }

      50% {
        opacity: 1;
      }
    }

    .gpt-cursor {
      display: inline-block;
      font-size: clamp(16px, 2.8vmin + 0.4rem, 28px);
      line-height: 0;
      vertical-align: middle;
      position: relative;
      top: -0.3vmin;
      margin-left: 1vmin;
      animation: twinkle 1s infinite ease-in-out;
    }

    #bio-typed-text+.typed-cursor {
      font-size: clamp(16px, 2.8vmin + 0.4rem, 28px) !important;
      line-height: 0;
      vertical-align: middle;
      position: relative;
      top: -0.3vmin;
      margin-left: 1vmin;
    }

    .icon-box {
      font-size: 0;
      /* to remove text spacing */
      color: #d7d7d7;
      opacity: 0;
      display: flex;
      margin-top: 1.2rem;
      transition: opacity 1.5s ease;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
    }

    .icon-box svg {
      width: clamp(20px, 4vmin, 40px);
      height: clamp(20px, 4vmin, 40px);
      margin: 0 clamp(4px, 2vw, 16px);
      transition: transform 0.3s ease, fill 0.3s ease, color 0.3s ease;
      fill: #d7d7d7;
      color: #d7d7d7;
    }

    .icon-box svg:hover,
    .icon-box svg.touch-hover {
      transform: scale(1.2);
      fill: #ffffff;
      /* highlight on hover */
      color: #ffffff;
    }

    .main-box {
      position: absolute;
      top: 47%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 999;
    }

    .touch-hint-container {
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      /* Exactly calculates the remaining space to the bottom of the viewport */
      height: calc(53vh - 50%);
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    @keyframes fadeInHint {
      0% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }

    .touch-hint {
      display: none;
      font-family: 'Space Mono', monospace;
      /* Smaller font size as requested */
      font-size: clamp(8px, 1vmin + 0.15rem, 11px);
      color: rgba(215, 215, 215, 0.7);
      text-align: center;
    }

    @media (pointer: coarse) {
      .touch-hint.visible {
        display: block;
        animation: fadeInHint 1s ease forwards, twinkle 3s infinite ease-in-out 1s;
      }
    }

    .speedometer {
      position: absolute;
      font-family: 'Space Mono', monospace;
      font-size: clamp(8px, 1vmin + 0.15rem, 11px);
      color: rgba(215, 215, 215, 0.7);
      text-align: center;
      opacity: 0;
      transition: opacity 1s ease, color 0.3s ease;
      pointer-events: none;
      white-space: nowrap;
    }

    @keyframes shake {
      0% {
        margin-top: 1px;
        margin-left: 1px;
      }

      10% {
        margin-top: -2px;
        margin-left: -1px;
      }

      20% {
        margin-top: 0px;
        margin-left: -3px;
      }

      30% {
        margin-top: 2px;
        margin-left: 3px;
      }

      40% {
        margin-top: -1px;
        margin-left: 1px;
      }

      50% {
        margin-top: 2px;
        margin-left: -1px;
      }

      60% {
        margin-top: 1px;
        margin-left: -3px;
      }

      70% {
        margin-top: 1px;
        margin-left: 3px;
      }

      80% {
        margin-top: -1px;
        margin-left: -1px;
      }

      90% {
        margin-top: 2px;
        margin-left: 1px;
      }

      100% {
        margin-top: -2px;
        margin-left: 1px;
      }
    }

    .shake-effect {
      animation: shake 0.5s infinite;
    }

    /* ── Blog panel (iframe overlay) ── */
    #blog-panel {
      position: fixed;
      inset: 0;
      z-index: 4000;
      transform: translateX(100vw);
      transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    #blog-panel.open {
      transform: translateX(0);
      pointer-events: all;
    }

    #blog-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

  </style>
</head>

  <script>
    window.addEventListener('load', () => {
      const cover = document.querySelector('.black-cover');
      const ironText = document.getElementById('ironText');
      const upwardDuration = 6000;
      const upwardDisplacement = '-250vh';

      const glass = document.getElementById('signature-splash');
      const sigContainer = document.getElementById('sig-container');

      // 3.7x master speed multiplier with user's customized linear timings
      const MASTER_SPEED = 3.7;
      const LOCKED_TIMINGS = [
        { dur: 2350, pause: 150, ease: 'linear', name: "S (Sai)" },
        { dur: 1650, pause: 200, ease: 'linear', name: "ai (Sai)" },
        { dur: 350,  pause: 250, ease: 'linear', name: "Dot of i" },
        { dur: 2350, pause: 150, ease: 'linear', name: "S (Sarath)" },
        { dur: 4800, pause: 180, ease: 'linear', name: "arath (Sarath)" },
        { dur: 350,  pause: 150, ease: 'linear', name: "t cross-bar" }
      ];

      let paths = [];
      let pathLengths = [];
      let schedule = [];
      let TOTAL_DURATION = 0;
      let startTime = null;

      async function initSignatureSplash() {
        try {
          const resp = await fetch('ss_smooth.svg');
          const svgText = await resp.text();
          sigContainer.innerHTML = svgText;

          const svgEl = sigContainer.querySelector('svg');
          if (!svgEl) return fallbackOldCover();

          paths = Array.from(svgEl.querySelectorAll('path'));
          pathLengths = paths.map(p => {
            const len = p.getTotalLength();
            p.style.stroke = '#ffffff';
            p.style.strokeDasharray = `${len} ${len}`;
            p.style.strokeDashoffset = `${len}`;
            return len;
          });

          // Build schedule scaled by 3.7x
          schedule = [];
          let cur = 0;
          for (let i = 0; i < LOCKED_TIMINGS.length; i++) {
            const item = LOCKED_TIMINGS[i];
            const scaledDur = item.dur / MASTER_SPEED;
            const scaledPause = item.pause / MASTER_SPEED;
            schedule.push({
              start: cur,
              end: cur + scaledDur,
              duration: scaledDur,
              name: item.name
            });
            cur += scaledDur + scaledPause;
          }
          TOTAL_DURATION = cur;

          // Start drawing stroke animation immediately without fade-in delay
          startTime = performance.now();
          requestAnimationFrame(tickSignature);

        } catch (err) {
          console.error('Failed to load signature SVG:', err);
          fallbackOldCover();
        }
      }

      function tickSignature(now) {
        const elapsed = now - startTime;

        for (let i = 0; i < schedule.length; i++) {
          const s = schedule[i];
          const len = pathLengths[i];
          const p = paths[i];

          if (elapsed >= s.end) {
            p.style.strokeDashoffset = '0';
          } else if (elapsed >= s.start && elapsed < s.end) {
            const prog = Math.max(0, Math.min(1, (elapsed - s.start) / s.duration));
            p.style.strokeDashoffset = `${len * (1 - prog)}`;
          } else {
            p.style.strokeDashoffset = `${len}`;
          }
        }

        if (elapsed < TOTAL_DURATION) {
          requestAnimationFrame(tickSignature);
        } else {
          // Finished writing! Linger for 300ms, then fade out glass card and move cover upward
          setTimeout(() => {
            glass.style.opacity = 0;
            setTimeout(() => {
              glass.style.display = 'none';
            }, 800);
            animateCoverUp();
          }, 350);
        }
      }

      function fallbackOldCover() {
        animateCoverUp();
      }

      // 250ms delay for page startup before drawing begins
      setTimeout(() => {
        initSignatureSplash();
      }, 250);

      function animateCoverUp() {
        cover.style.transition = `transform ${upwardDuration}ms cubic-bezier(0.22, 1, 0.36, 1)`;
        cover.style.transform = `translateY(${upwardDisplacement})`;

        setTimeout(() => {
          const iconBox = document.querySelector('.icon-box');

          glassPanel.style.display = 'flex';

          setTimeout(() => {

          setTimeout(() => {

          setTimeout(() => {
            bioText.classList.add('show');

            // show cursor after box expands (1.5s transition time)
            setTimeout(() => {
              const cursorContainer = document.getElementById('gpt-cursor-container');
              if (cursorContainer) cursorContainer.style.display = 'inline-block';

              // blink for 1 second before typing
              setTimeout(() => {
                if (cursorContainer) cursorContainer.style.display = 'none';

                const targetEl = document.getElementById('bio-typed-text');
                const targetText = 'Hi, I\'m a 17-year-old tech enthusiast and JEE aspirant studying at Sri Chaitanya Techno School, Neelambur<br><br>I enjoy exploring technology with tech stuff, building small projects, and listening to music in my free time';
                let charIdx = 0;

                const cursor = document.createElement('span');
                cursor.className = 'typed-cursor typed-cursor--blink';
                cursor.innerText = '●';
                targetEl.parentNode.insertBefore(cursor, targetEl.nextSibling);

                const typeNextChar = () => {
                  if (charIdx < targetText.length) {
                    // If we encounter an HTML tag (like <br>), read the whole tag at once
                    if (targetText[charIdx] === '<') {
                      let tag = '';
                      while (charIdx < targetText.length && targetText[charIdx] !== '>') {
                        tag += targetText[charIdx];
                        charIdx++;
                      }
                      if (charIdx < targetText.length && targetText[charIdx] === '>') {
                        tag += '>';
                        charIdx++;
                      }
                      targetEl.innerHTML += tag;

                      // Process the next character immediately without delay
                      typeNextChar();
                      return;
                    }

                    // Otherwise, type the single character
                    targetEl.innerHTML += targetText[charIdx];
                    charIdx++;

                    // Base delay of 25ms per letter
                    let delay = 25;
                    // Add slight random jitter (±10ms)
                    delay += (Math.random() * 20) - 10;

                    setTimeout(typeNextChar, delay);
                  } else {
                    setTimeout(() => {

                    // Only show the hint if the user hasn't already figured it out and slid away
                    if (!touchHintHidden) {
                      const hint = document.querySelector('.touch-hint');
                      if (hint) hint.classList.add('visible');

                  }
                };

                window.typingStarted = true;
                typeNextChar();
              }, 1000); // 1 second blink delay

  <script>
    const STAR_COLOR = '#fff';
    const STAR_SIZE = 3;
    const STAR_MIN_SCALE = 0.2;
    const OVERFLOW_THRESHOLD = 50;
    const STAR_COUNT = (window.innerWidth + window.innerHeight) / 14;

    const canvas = document.querySelector('canvas'),
      context = canvas.getContext('2d');

    let scale = 1,
      width,
      height;

    let stars = [];
    let pointerX, pointerY;
    let velocity = { x: 0, y: 0, tx: 0, ty: 0, z: 0.0005 };
    let touchInput = false;
    let idleTimer = null;
    let isIdle = true;
    let touchHintHidden = false;
    let hasInteracted = false;
    let isWarpSpeed = false;
    let warpFactor = 0;

    generate();
    resize();
    step();

    window.onresize = resize;
    document.onmousemove = onMouseMove;
    document.onmouseleave = onMouseLeave;
    document.addEventListener('touchstart', onTouchStart, { passive: false });
    document.addEventListener('touchmove', onTouchMove, { passive: false });
    document.addEventListener('touchend', onMouseLeave);

    // ── Blog panel open / close ──
    const blogPanel = document.getElementById('blog-panel');
    const mainBox = document.querySelector('.main-box');

    function openBlogPanel() {
      const frame = document.getElementById('blog-frame');
      if (!frame) {
        blogPanel.innerHTML = '<iframe id="blog-frame" src="blog.html" frameborder="0" title="Blog"></iframe>';
      }
      blogPanel.classList.add('open');
      history.pushState({ blog: true }, '', '#blog');
    }

    // Exposed globally so it can be called programmatically if needed
    window.closeBlogPanel = function () {
      blogPanel.classList.remove('open');
    };

    document.getElementById('globe-link').addEventListener('click', (e) => {
      e.preventDefault();
      openBlogPanel();
    });

    // Browser back button
    window.addEventListener('popstate', () => {
      if (blogPanel.classList.contains('open')) {
        window.closeBlogPanel();
      }
    });

    function generate() {
      for (let i = 0; i < STAR_COUNT; i++) {
        stars.push({
          x: 0,
          y: 0,
          z: STAR_MIN_SCALE + Math.random() * (1 - STAR_MIN_SCALE),
        });
      }
    }

    function placeStar(star) {
      star.x = Math.random() * width;
      star.y = Math.random() * height;
    }

    function recycleStar(star) {
      let direction = 'z';
      let vx = Math.abs(velocity.x),
        vy = Math.abs(velocity.y);

      if (vx > 1 || vy > 1) {
        let axis =
          vx > vy
            ? Math.random() < vx / (vx + vy)
              ? 'h'
              : 'v'
            : Math.random() < vy / (vx + vy)
              ? 'v'
              : 'h';

        if (axis === 'h') direction = velocity.x > 0 ? 'l' : 'r';
        else direction = velocity.y > 0 ? 't' : 'b';
      }

      star.z = STAR_MIN_SCALE + Math.random() * (1 - STAR_MIN_SCALE);

      if (direction === 'z') {
        star.z = 0.1;
        star.x = Math.random() * width;
        star.y = Math.random() * height;
      } else if (direction === 'l') {
        star.x = -OVERFLOW_THRESHOLD;
        star.y = height * Math.random();
      } else if (direction === 'r') {
        star.x = width + OVERFLOW_THRESHOLD;
        star.y = height * Math.random();
      } else if (direction === 't') {
        star.x = width * Math.random();
        star.y = -OVERFLOW_THRESHOLD;
      } else if (direction === 'b') {
        star.x = width * Math.random();
        star.y = height + OVERFLOW_THRESHOLD;
      }
    }

    function resize() {
      scale = window.devicePixelRatio || 1;
      width = window.innerWidth * scale;
      height = window.innerHeight * scale;
      canvas.width = width;
      canvas.height = height;
      stars.forEach(placeStar);
    }

    function step() {
      context.clearRect(0, 0, width, height);
      update();
      render();
      requestAnimationFrame(step);
    }

    function update() {
      if (isIdle) {
        // drift towards top left corner at 45 deg
        velocity.tx += (-0.3 - velocity.tx) * 0.05;
        velocity.ty += (-0.3 - velocity.ty) * 0.05;
      } else {
        velocity.tx *= 0.96;
        velocity.ty *= 0.96;
      }
      velocity.x += (velocity.tx - velocity.x) * 0.8;
      velocity.y += (velocity.ty - velocity.y) * 0.8;

      let currentSpeed = Math.round(Math.hypot(velocity.x, velocity.y) * 100);
      isWarpSpeed = currentSpeed >= 25000;
      
      let targetWarp = isWarpSpeed ? 1 : 0;
      warpFactor += (targetWarp - warpFactor) * 0.05; // Smoothly fades in and out

      const speedo = document.getElementById('speedometer');
      if (speedo && hasInteracted && window.typingStarted) {
        if (isWarpSpeed) {
          speedo.innerText = 'WARP SPEED ACHIEVED';
          speedo.style.color = '#ff0000';
          speedo.style.fontWeight = 'bold';
          speedo.style.letterSpacing = '2px';
          document.querySelector('.main-box').classList.add('shake-effect');
        } else {
          speedo.innerText = currentSpeed + ' km/s';
          speedo.style.color = 'rgba(215, 215, 215, 0.7)';
          speedo.style.fontWeight = 'normal';
          speedo.style.letterSpacing = 'normal';
          document.querySelector('.main-box').classList.remove('shake-effect');
        }

        // Hide if settled back at normal idle speed (-0.3, -0.3)
        if (isIdle && Math.abs(velocity.x - (-0.3)) < 0.05 && Math.abs(velocity.y - (-0.3)) < 0.05) {
          speedo.style.opacity = '0';
        } else {
          speedo.style.opacity = '1';
        }
      }

      stars.forEach((star) => {
        star.x += velocity.x * star.z;
        star.y += velocity.y * star.z;
        star.x += (star.x - width / 2) * velocity.z * star.z;
        star.y += (star.y - height / 2) * velocity.z * star.z;
        star.z += velocity.z;

        if (
          star.x < -OVERFLOW_THRESHOLD ||
          star.x > width + OVERFLOW_THRESHOLD ||
          star.y < -OVERFLOW_THRESHOLD ||
          star.y > height + OVERFLOW_THRESHOLD
        ) {
          recycleStar(star);
        }
      });
    }

    function render() {
      context.save();
      if (warpFactor > 0.01) {
        const shakeX = (Math.random() - 0.5) * (8 * warpFactor);
        const shakeY = (Math.random() - 0.5) * (8 * warpFactor);
        context.translate(shakeX, shakeY);
      }

      stars.forEach((star) => {
        context.beginPath();
        context.lineCap = 'round';
        context.lineWidth = STAR_SIZE * star.z * scale;
        
        let baseAlpha = 0.5 + 0.5 * Math.random();
        context.globalAlpha = baseAlpha + (0.8 - baseAlpha) * warpFactor;
        
        // Smoothly transition color from #fff (255, 255, 255) to #ff0000 (255, 0, 0)
        let r = 255;
        let g = Math.round(255 * (1 - warpFactor));
        let b = Math.round(255 * (1 - warpFactor));
        context.strokeStyle = `rgb(${r}, ${g}, ${b})`;
        
        context.moveTo(star.x, star.y);

        let tailMultiplier = 2 + (15 - 2) * warpFactor;
        let tailX = velocity.x * tailMultiplier,
          tailY = velocity.y * tailMultiplier;
        if (Math.abs(tailX) < 0.1) tailX = 0.5;
        if (Math.abs(tailY) < 0.1) tailY = 0.5;

        context.lineTo(star.x + tailX, star.y + tailY);
        context.stroke();
      });

      context.restore();
    }

    function movePointer(x, y) {
      isIdle = false;
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        isIdle = true;
      }, 1000);

      if (typeof pointerX === 'number' && typeof pointerY === 'number') {
        let ox = x - pointerX,
          oy = y - pointerY;
        velocity.tx += (ox / 8) * scale * (touchInput ? 1 : -1);
        velocity.ty += (oy / 8) * scale * (touchInput ? 1 : -1);
      }
      pointerX = x;
      pointerY = y;
    }

    function hideTouchHint() {
      if (!touchHintHidden) {
        touchHintHidden = true;
        const hint = document.querySelector('.touch-hint');
        if (hint && hint.classList.contains('visible')) {
          hint.style.transition = 'opacity 0.5s ease';
          hint.style.opacity = '0';
          setTimeout(() => {
            hint.style.display = 'none';
            hasInteracted = true;
          }, 500);
        } else {
          if (hint) hint.style.display = 'none';
          hasInteracted = true;
        }
      } else {
        hasInteracted = true;
      }
    }

    function onMouseMove(event) {
      if (blogPanel.classList.contains('open')) return;
      hideTouchHint();
      touchInput = false;
      movePointer(event.clientX, event.clientY);
    }

    function onTouchStart(event) {
      if (blogPanel.classList.contains('open')) return;
      hideTouchHint();
      touchInput = true;
      pointerX = event.touches[0].clientX;
      pointerY = event.touches[0].clientY;
      isIdle = false;
      clearTimeout(idleTimer);
    }

    function onTouchMove(event) {
      if (blogPanel.classList.contains('open')) return;
      touchInput = true;
      const tx = event.touches[0].clientX;
      const ty = event.touches[0].clientY;
      movePointer(tx, ty);

      // Simulate hover for SVG icons with a larger proximity radius (50px)
      // This prevents the finger from completely hiding the icon while hovering
      const HOVER_RADIUS = 50;
      document.querySelectorAll('.icon-box svg').forEach(svg => {
        const rect = svg.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;

        // Calculate distance from finger to center of icon
        if (Math.hypot(tx - cx, ty - cy) < HOVER_RADIUS) {
          svg.classList.add('touch-hover');
        } else {
          svg.classList.remove('touch-hover');
        }
      });

      // Explicitly prevent scrolling to ensure the browser doesn't eat the drag event
      event.preventDefault();
    }

    function onMouseLeave() {
      pointerX = null;
      pointerY = null;
      document.querySelectorAll('.touch-hover').forEach(node => node.classList.remove('touch-hover'));
    }
  </script>
