<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Writing — Saisarath</title>
  <meta name="description" content="Selected writings by Saisarath." />

  <!-- Premium Typography: Syne (Ultra Bold/Display) + Plus Jakarta Sans + Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />

  <style>
    :root {
      --bg: #070709;
      --surface: #0e0e12;
      --surface-border: rgba(255, 255, 255, 0.08);
      --text: #f4f4f6;
      --text-muted: #7c7c8a;
      --accent: #5e6ad2;
      --accent-glow: rgba(94, 106, 210, 0.25);
      --font-display: 'Syne', sans-serif;
      --font-heading: 'Space Grotesk', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      cursor: default;
    }

    /* Noise Texture Overlay */
    .grain {
      position: fixed;
      inset: -50%;
      width: 200%;
      height: 200%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 100;
    }

    /* Ambient Spotlight that follows cursor */
    .spotlight {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(94, 106, 210, 0.12) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 1;
      transition: opacity 0.3s ease;
    }

    /* Custom smooth scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }

    .site-wrapper {
      position: relative;
      z-index: 2;
      max-width: 1100px;
      margin: 0 auto;
      padding: 3.5rem 2rem 8rem;
    }

    /* ── Header ── */
    header {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 5rem;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 8px 18px;
      border-radius: 100px;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .back-btn:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.05);
      transform: translateX(-3px);
    }

    .back-btn svg {
      transition: transform 0.3s ease;
    }
    .back-btn:hover svg {
      transform: translateX(-3px);
    }

    /* ── Hero Section ── */
    .hero {
      margin-bottom: 5rem;
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(3rem, 7vw, 5.5rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.04em;
      text-transform: uppercase;
    }

    .hero-title span.dim {
      color: rgba(255, 255, 255, 0.25);
      display: block;
    }

    /* ── Articles List ── */
    .articles-container {
      display: flex;
      flex-direction: column;
    }

    .article-row {
      position: relative;
      display: grid;
      grid-template-columns: 80px 1fr 100px 40px;
      align-items: center;
      padding: 2.5rem 0;
      border-bottom: 1px solid var(--surface-border);
      text-decoration: none;
      color: inherit;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .article-row:first-child {
      border-top: 1px solid var(--surface-border);
    }

    .article-row::before {
      content: "";
      position: absolute;
      inset: 0 -2rem;
      background: rgba(255, 255, 255, 0.02);
      opacity: 0;
      border-radius: 12px;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .article-row:hover::before {
      opacity: 1;
    }

    .article-num {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      transition: color 0.3s ease;
    }

    .article-main {
      padding-right: 2rem;
    }

    .article-title {
      font-family: var(--font-heading);
      font-size: clamp(1.4rem, 2.5vw, 2.1rem);
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.025em;
      color: #fff;
      margin-bottom: 0.6rem;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), color 0.3s ease;
    }

    .article-row:hover .article-title {
      transform: translateX(12px);
      color: #a5b4fc;
    }

    .article-row:hover .article-num {
      color: #818cf8;
    }

    .article-summary {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      max-width: 620px;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .article-row:hover .article-summary {
      transform: translateX(12px);
    }

    .article-meta {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      text-align: right;
    }

    .article-arrow {
      display: flex;
      justify-content: flex-end;
      color: var(--text-muted);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), color 0.3s ease;
    }

    .article-row:hover .article-arrow {
      transform: translate(6px, -6px);
      color: #fff;
    }

    /* ── Immersive Reader View ── */
    #reader-view {
      display: none;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .reader-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: 1px solid var(--surface-border);
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 100px;
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 3rem;
      transition: all 0.2s ease;
    }

    .reader-back:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.3);
    }

    .reader-header {
      margin-bottom: 4rem;
      padding-bottom: 2.5rem;
      border-bottom: 1px solid var(--surface-border);
    }

    .reader-tag {
      font-family: var(--font-mono);
      font-size: 12px;
      color: #818cf8;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
      display: block;
    }

    .reader-title {
      font-family: var(--font-heading);
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 1.5rem;
    }

    .reader-date {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-muted);
    }

    .reader-body {
      max-width: 720px;
      font-size: 17px;
      line-height: 1.85;
      color: #d1d1db;
    }

    .reader-body p {
      margin-bottom: 1.8rem;
    }

    .reader-body p.lead {
      font-size: 21px;
      line-height: 1.6;
      color: #ffffff;
      font-weight: 400;
    }

    .reader-body h2 {
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: 600;
      color: #fff;
      margin: 3.5rem 0 1.25rem;
      letter-spacing: -0.02em;
    }

    .reader-body pre {
      background: #0d0d12;
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 1.5rem;
      font-family: var(--font-mono);
      font-size: 13.5px;
      color: #e0e7ff;
      overflow-x: auto;
      margin: 2rem 0;
      line-height: 1.65;
    }

    .reader-body code:not(pre code) {
      font-family: var(--font-mono);
      background: rgba(255, 255, 255, 0.08);
      color: #a5b4fc;
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 14px;
    }

    /* ── Footer ── */
    footer {
      margin-top: 8rem;
      padding-top: 2.5rem;
      border-top: 1px solid var(--surface-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
    }

    .footer-links {
      display: flex;
      gap: 20px;
    }

    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-links a:hover {
      color: #fff;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .site-wrapper { padding: 2rem 1.25rem 5rem; }
      .article-row {
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 2rem 0;
      }
      .article-num { display: none; }
      .article-main { padding-right: 0; }
      .article-meta { text-align: left; }
      .article-arrow { display: none; }
      .hero-title { font-size: 2.8rem; }
    }
  </style>
</head>

<body>
  <div class="grain"></div>
  <div class="spotlight" id="spotlight"></div>

  <div class="site-wrapper">

    <!-- Top Navigation -->
    <header id="site-header">
      <button class="back-btn" onclick="handleExit()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>saisarath.com</span>
      </button>
    </header>

    <!-- Main Index View -->
    <main id="index-view">
      <div class="hero">
        <h1 class="hero-title">
          Selected
          <span class="dim">Writings</span>
        </h1>
      </div>

      <div class="articles-container" id="articles-list">
        <!-- Articles rendered via JavaScript -->
      </div>
    </main>

    <!-- Article Reader View -->
    <article id="reader-view">
      <button class="reader-back" onclick="closeArticle()">
        ← Back to index
      </button>

      <div class="reader-header">
        <span class="reader-tag" id="r-tag">SYSTEMS</span>
        <h1 class="reader-title" id="r-title"></h1>
        <div class="reader-date" id="r-date"></div>
      </div>

      <div class="reader-body" id="r-body"></div>
    </article>

    <!-- Clean Footer -->
    <footer>
      <span>&copy; 2026 Saisarath</span>
      <div class="footer-links">
        <a href="https://github.com/saisarathbb" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://x.com/saisarathbb" target="_blank" rel="noopener noreferrer">Twitter / X</a>
        <a href="mailto:hello@saisarath.com" target="_blank" rel="noopener noreferrer">Email</a>
      </div>
    </footer>

  </div>

  <script>
    const posts = [
      {
        id: "01",
        tag: "NOTE",
        title: "First Post — Yet to develop",
        summary: "This entry is currently queued for publication. Full technical notes and development writeups will be published here upon completion.",
        date: "Oct 2026",
        body: `
          <p class="lead">This post is currently in progress.</p>
          <p>Full technical logs, development notes, and architecture diagrams will appear here once finalized.</p>
          <pre><code>status: yet to develop</code></pre>
        `
      },
      {
        id: "02",
        tag: "NOTE",
        title: "Second Post — Yet to develop",
        summary: "This entry is currently queued for publication. Full technical notes and development writeups will be published here upon completion.",
        date: "Aug 2026",
        body: `
          <p class="lead">This post is currently in progress.</p>
          <p>Full technical logs, development notes, and architecture diagrams will appear here once finalized.</p>
          <pre><code>status: yet to develop</code></pre>
        `
      },
      {
        id: "03",
        tag: "NOTE",
        title: "Third Post — Yet to develop",
        summary: "This entry is currently queued for publication. Full technical notes and development writeups will be published here upon completion.",
        date: "Jun 2026",
        body: `
          <p class="lead">This post is currently in progress.</p>
          <p>Full technical logs, development notes, and architecture diagrams will appear here once finalized.</p>
          <pre><code>status: yet to develop</code></pre>
        `
      },
      {
        id: "04",
        tag: "NOTE",
        title: "Fourth Post — Yet to develop",
        summary: "This entry is currently queued for publication. Full technical notes and development writeups will be published here upon completion.",
        date: "Apr 2026",
        body: `
          <p class="lead">This post is currently in progress.</p>
          <p>Full technical logs, development notes, and architecture diagrams will appear here once finalized.</p>
          <pre><code>status: yet to develop</code></pre>
        `
      },
      {
        id: "05",
        tag: "NOTE",
        title: "Fifth Post — Yet to develop",
        summary: "This entry is currently queued for publication. Full technical notes and development writeups will be published here upon completion.",
        date: "Jan 2026",
        body: `
          <p class="lead">This post is currently in progress.</p>
          <p>Full technical logs, development notes, and architecture diagrams will appear here once finalized.</p>
          <pre><code>status: yet to develop</code></pre>
        `
      }
    ];

    const indexView = document.getElementById('index-view');
    const readerView = document.getElementById('reader-view');
    const articlesList = document.getElementById('articles-list');
    const spotlight = document.getElementById('spotlight');

    // Interactive Spotlight Effect
    window.addEventListener('mousemove', (e) => {
      spotlight.style.left = e.clientX + 'px';
      spotlight.style.top = e.clientY + 'px';
    });

    // Render Articles List
    function renderList() {
      articlesList.innerHTML = posts.map(post => `
        <div class="article-row" onclick="openPost('${post.id}')">
          <span class="article-num">${post.id}</span>
          <div class="article-main">
            <h2 class="article-title">${post.title}</h2>
            <p class="article-summary">${post.summary}</p>
          </div>
          <div class="article-meta">
            <span>${post.date}</span>
          </div>
          <div class="article-arrow">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </div>
        </div>
      `).join('');
    }

    const siteHeader = document.getElementById('site-header');

    // Open Reader
    function openPost(id) {
      const p = posts.find(item => item.id === id);
      if (!p) return;

      document.getElementById('r-tag').textContent = p.tag;
      document.getElementById('r-title').textContent = p.title;
      document.getElementById('r-date').textContent = p.date;
      document.getElementById('r-body').innerHTML = p.body;

      if (siteHeader) siteHeader.style.display = 'none';
      indexView.style.display = 'none';
      readerView.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Close Reader
    function closeArticle() {
      readerView.style.display = 'none';
      indexView.style.display = 'block';
      if (siteHeader) siteHeader.style.display = 'flex';
    }

    // Exit handler (works in iframe or standalone)
    function handleExit() {
      if (window.parent && window.parent !== window && typeof window.parent.closeBlogPanel === 'function') {
        window.parent.closeBlogPanel();
      } else {
        window.location.href = 'index.html';
      }
    }

    renderList();
  </script>
</body>

</html>
